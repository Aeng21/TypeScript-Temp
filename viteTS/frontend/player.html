<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Data Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f4f4f4;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
        }

        h2 {
            margin-top: 0;
        }

        form#formTambah {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        form#formTambah input {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            min-width: 120px;
        }

        form#formTambah button {
            padding: 8px 16px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }

        th {
            background: #f2f2f2;
        }

        .action-btn {
            padding: 4px 10px;
            margin: 0 4px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .edit-btn {
            background: #007bff;
            color: #fff;
        }

        .delete-btn {
            background: #dc3545;
            color: #fff;
        }

        .edit-btn:hover {
            background: #0056b3;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .backLink {
            display: inline-block;
            margin-top: 20px;
            color: #007bff;
            text-decoration: none;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 999;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-card {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            width: 400px;
            max-width: 90%;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .modal-card h3 {
            margin-top: 0;
            margin-bottom: 20px;
            color: #333;
        }

        .modal-card .form-group {
            margin-bottom: 15px;
        }

        .modal-card .form-group label {
            display: block;
            margin-bottom: 4px;
            font-weight: bold;
        }

        .modal-card .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .modal-card .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            margin-top: 20px;
        }

        .modal-card .modal-actions button {
            padding: 8px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        .modal-card .modal-actions .btn-save {
            background: #28a745;
            color: #fff;
        }

        .modal-card .modal-actions .btn-cancel {
            background: #6c757d;
            color: #fff;
        }

        .modal-card .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            cursor: pointer;
            color: #aaa;
        }

        .modal-card .close-btn:hover {
            color: #000;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>🧑 Data Player</h2>

        <form id="formTambah">
            <input type="text" id="namaTambah" placeholder="Nama" required />
            <input type="text" id="alamatTambah" placeholder="Alamat" required />
            <input type="text" id="rankTambah" placeholder="Rank" required />
            <button type="submit">Tambah</button>
        </form>

        <table>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Nama</th>
                    <th>Alamat</th>
                    <th>Rank</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tbodyPlayer"></tbody>
        </table>

        <a href="index.html" class="backLink">← Kembali ke Beranda</a>
    </div>

    <!-- MODAL EDIT -->
    <div class="modal-overlay" id="modalEdit">
        <div class="modal-card">
            <span class="close-btn" id="modalClose">&times;</span>
            <h3>Edit Player</h3>
            <form id="formEdit">
                <div class="form-group">
                    <label for="namaEdit">Nama</label>
                    <input type="text" id="namaEdit" required />
                </div>
                <div class="form-group">
                    <label for="alamatEdit">Alamat</label>
                    <input type="text" id="alamatEdit" required />
                </div>
                <div class="form-group">
                    <label for="rankEdit">Rank</label>
                    <input type="text" id="rankEdit" required />
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="btnCancelEdit">Batal</button>
                    <button type="submit" class="btn-save">Simpan Perubahan</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/src/player.ts"></script>
</body>

</html>
